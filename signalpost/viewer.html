<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Signalpost</title>
<style>
/* Design read: lookup tool for reviewers checking company records.
   Trust-first, calm. Dials: variance 3, motion 2, density 4.
   One accent, one radius (6px), one theme that follows the system setting. */
:root {
  --bg: #f1f3f5;
  --surface: #fafbfc;
  --ink: #151a21;
  --muted: #536070;
  --line: #d5dbe2;
  --accent: #1b4f8f;
  --radius: 6px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b;
    --surface: #181d23;
    --ink: #e6eaef;
    --muted: #9ba7b4;
    --line: #2a323b;
    --accent: #86b4ee;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font);
}
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }

.top {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
.runinfo { color: var(--muted); font-size: 13px; text-align: right; }

.shell {
  display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  min-height: calc(100dvh - 60px);
}
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 16px; display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=search], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; width: 100%;
}
input::placeholder { color: var(--muted); }
.list { overflow: auto; max-height: calc(100dvh - 60px - 150px); }
.item {
  display: grid; width: 100%; text-align: left; gap: 2px; padding: 10px 16px;
  background: none; border: 0; border-left: 3px solid transparent; color: inherit; font: inherit; cursor: pointer;
  transition: background-color .12s;
}
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--bg); border-left-color: var(--accent); }
.item .n { font-weight: 600; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.more { margin: 12px 16px 20px; }
button.plain {
  font: inherit; color: var(--accent); background: none; border: 1px solid var(--accent);
  border-radius: var(--radius); padding: 8px 14px; cursor: pointer;
}
button.plain:active { transform: translateY(1px); }

.detail { padding: 32px clamp(16px, 4vw, 56px) 64px; max-width: 980px; }
.head h2 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; letter-spacing: -0.025em; margin: 0 0 8px; overflow-wrap: anywhere; }
.head .sub { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.badge { border: 1px solid var(--ink); border-radius: var(--radius); padding: 1px 8px; font-size: 13px; }
.badge.off { background: var(--ink); color: var(--bg); }

section { margin-top: 36px; }
section h3 { font-size: 17px; margin: 0 0 12px; letter-spacing: -0.01em; }
dl { margin: 0; display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr); gap: 14px 24px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.src { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 12px 8px 0; vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 13px; }
td.r, th.r { text-align: right; }
ul.plainlist { margin: 0; padding-left: 18px; }
ul.plainlist li { margin: 4px 0; }
.empty, .error { padding: 40px 24px; color: var(--muted); }
.error { color: var(--ink); }

@media (max-width: 767px) {
  .top { padding: 0 16px; }
  .runinfo { font-size: 12px; }
  .shell { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 38dvh; }
  dl { grid-template-columns: 1fr; gap: 2px 0; }
  dd { margin-bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .item { transition: none; }
  button.plain:active { transform: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Signalpost</h1>
  <div class="runinfo" id="runinfo"></div>
</header>
<main class="shell" id="shell">
  <aside class="side" aria-label="Companies">
    <div class="filters">
      <label>Search name or number
        <input type="search" id="q" placeholder="For example Equinor or 923609016" autocomplete="off">
      </label>
      <label>Status
        <select id="status"><option value="">All statuses</option></select>
      </label>
    </div>
    <div class="list" id="list" role="list"></div>
  </aside>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var payload;
  try { payload = JSON.parse(document.getElementById("data").textContent); }
  catch (e) {
    document.getElementById("shell").innerHTML = "";
    var err = document.createElement("p");
    err.className = "error";
    err.textContent = "The profile data could not be read. Run the agent again to rebuild this page.";
    document.getElementById("shell").appendChild(err);
    return;
  }
  var profiles = payload.profiles || [];
  var report = payload.report || {};
  var PAGE = 150, shown = PAGE, current = null;

  var LABELS = {
    legal_form: "Legal form", registered_in_enhetsregisteret: "Registered", founded: "Founded",
    business_address: "Business address", municipality: "Municipality", postal_address: "Postal address",
    industry_1: "Main industry", industry_2: "Industry 2", industry_3: "Industry 3",
    employees: "Employees", institutional_sector: "Sector", vat_registered: "VAT registered",
    in_business_register: "In Register of Business Enterprises", website: "Website", email: "Email",
    phone: "Phone", stated_purpose: "Stated purpose", stated_activity: "Activity",
    parent_organisation: "Parent unit", sub_units: "Sub-units", last_filed_accounts_year: "Latest filed accounts",
    ceo: "CEO", board_chair: "Board chair", board_size: "Board members", auditor: "Auditor", accountant: "Accountant",
    bankruptcy_date: "Bankruptcy date", liquidation_start: "Liquidation started", closed_on: "Closed", deleted_on: "Removed from register"
  };
  var SECTIONS = [
    ["Identity", ["legal_form", "registered_in_enhetsregisteret", "founded", "bankruptcy_date", "liquidation_start", "closed_on", "deleted_on", "parent_organisation", "sub_units"]],
    ["Location", ["business_address", "municipality", "postal_address"]],
    ["Business", ["industry_1", "industry_2", "industry_3", "employees", "institutional_sector", "vat_registered", "in_business_register", "stated_purpose", "stated_activity", "website", "email", "phone"]],
    ["People", ["ceo", "board_chair", "board_size", "auditor", "accountant"]]
  ];
  var MONEY = [["revenue", "Operating revenue"], ["operating_result", "Operating result"], ["net_result", "Net result"], ["total_assets", "Total assets"], ["equity", "Equity"]];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function day(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }
  function money(v, cur) {
    var s = new Intl.NumberFormat("nb-NO", { maximumFractionDigits: 0 }).format(v).replace(/−/g, "-");
    return s + (cur ? " " + cur : "");
  }
  function name(p) { return p.facts && p.facts.name ? p.facts.name.value : "Unnamed (" + p.orgnr + ")"; }
  function plainValue(v) {
    if (typeof v === "boolean") return v ? "Yes" : "No";
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return day(v);
    return String(v);
  }
  function source(f) {
    var s = el("span", "src");
    if (/^https?:\/\//.test(f.source_url || "")) {
      var a = el("a", null, f.source);
      a.href = f.source_url; a.target = "_blank"; a.rel = "noopener noreferrer";
      s.appendChild(a);
    } else { s.appendChild(document.createTextNode(f.source || "Source")); }
    var tail = ", retrieved " + day(f.retrieved_at);
    if (f.as_of) tail += ", refers to " + day(f.as_of);
    s.appendChild(document.createTextNode(tail));
    return s;
  }

  function renderRun() {
    var parts = [profiles.length.toLocaleString("en-GB") + (profiles.length === 1 ? " profile" : " profiles")];
    if (report.finished_at) parts.push("run finished " + day(report.finished_at));
    document.getElementById("runinfo").textContent = parts.join(", ");
  }

  function filtered() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var st = document.getElementById("status").value;
    var digits = q.replace(/\s/g, "");
    return profiles.filter(function (p) {
      if (st && p.status !== st) return false;
      if (!q) return true;
      return name(p).toLowerCase().indexOf(q) !== -1 || p.orgnr.indexOf(digits) !== -1;
    });
  }

  function renderList() {
    var list = document.getElementById("list");
    list.textContent = "";
    var rows = filtered();
    if (!rows.length) {
      list.appendChild(el("p", "empty", "No companies match. Clear the search or choose another status."));
      return rows;
    }
    rows.slice(0, shown).forEach(function (p) {
      var b = el("button", "item");
      b.type = "button"; b.setAttribute("role", "listitem");
      if (current && current.orgnr === p.orgnr) b.setAttribute("aria-current", "true");
      b.appendChild(el("span", "n", name(p)));
      var m = el("span", "m");
      m.appendChild(el("span", "num", p.orgnr));
      m.appendChild(document.createTextNode("   " + p.status.replace(/_/g, " ")));
      b.appendChild(m);
      b.addEventListener("click", function () { select(p); });
      list.appendChild(b);
    });
    if (rows.length > shown) {
      var more = el("button", "plain more", "Show " + Math.min(PAGE, rows.length - shown) + " more");
      more.type = "button";
      more.addEventListener("click", function () { shown += PAGE; renderList(); });
      list.appendChild(more);
    }
    return rows;
  }

  function section(title) {
    var s = el("section");
    s.appendChild(el("h3", null, title));
    return s;
  }

  function renderDetail(p) {
    var d = document.getElementById("detail");
    d.textContent = "";
    if (!p) { d.appendChild(el("p", "empty", "Select a company to see its profile.")); return; }
    var head = el("div", "head");
    head.appendChild(el("h2", null, name(p)));
    var sub = el("div", "sub");
    sub.appendChild(el("span", "num", p.orgnr));
    var badge = el("span", "badge" + (p.status === "active" ? "" : " off"), p.status.replace(/_/g, " "));
    sub.appendChild(badge);
    sub.appendChild(el("span", null, "Checked " + day(p.checked_at)));
    head.appendChild(sub);
    d.appendChild(head);

    var facts = p.facts || {};
    if (!Object.keys(facts).length) {
      var none = section("No facts published");
      (p.explanation || []).forEach(function (t) { none.appendChild(el("p", null, t)); });
      d.appendChild(none);
      return;
    }

    SECTIONS.forEach(function (sec) {
      var keys = sec[1].filter(function (k) { return facts[k]; });
      if (!keys.length) return;
      var s = section(sec[0]);
      var dl = el("dl");
      keys.forEach(function (k) {
        var f = facts[k];
        dl.appendChild(el("dt", null, LABELS[k] || k));
        var dd = el("dd");
        var text = plainValue(f.value);
        if (k === "website" && /^https?:\/\//i.test(text)) {
          var a = el("a", null, text); a.href = text; a.rel = "noopener noreferrer"; dd.appendChild(a);
        } else { dd.appendChild(document.createTextNode(text)); }
        if (f.code && /industry|legal|sector/.test(k)) dd.appendChild(document.createTextNode(" (" + f.code + ")"));
        if (f.members && f.members.length) dd.appendChild(el("span", "src", f.members.join(", ")));
        dd.appendChild(source(f));
        dl.appendChild(dd);
      });
      s.appendChild(dl);
      d.appendChild(s);
    });

    var fin = MONEY.filter(function (m) { return facts[m[0]]; });
    if (fin.length) {
      var fs = section("Financials");
      var t = el("table");
      var thead = el("tr");
      ["Measure", "Amount", "Period ending"].forEach(function (h, i) {
        var th = el("th", i === 1 ? "r" : null, h); th.scope = "col"; thead.appendChild(th);
      });
      t.appendChild(thead);
      fin.forEach(function (m) {
        var f = facts[m[0]], tr = el("tr");
        tr.appendChild(el("td", null, m[1]));
        tr.appendChild(el("td", "r num", money(f.value, f.currency)));
        tr.appendChild(el("td", null, day(f.as_of)));
        t.appendChild(tr);
      });
      fs.appendChild(t);
      var first = facts[fin[0][0]];
      fs.appendChild(source(first));
      d.appendChild(fs);
    }

    var hist = (p.history || []).slice().reverse();
    var ch = section("Changes since first check");
    if (!hist.length) {
      ch.appendChild(el("p", null, "No changes detected. First checked " + day(p.first_checked_at || p.checked_at) + "."));
    } else {
      var ul = el("ul", "plainlist");
      hist.slice(0, 12).forEach(function (c) {
        var old = c.old == null ? "none" : plainValue(c.old);
        var nw = c.new == null ? "removed" : plainValue(c.new);
        ul.appendChild(el("li", null, day(c.detected_at) + ": " + (LABELS[c.field] || c.field) + " changed from " + old + " to " + nw));
      });
      ch.appendChild(ul);
    }
    d.appendChild(ch);

    var why = section("How this was matched");
    var wl = el("ul", "plainlist");
    (p.explanation || []).forEach(function (t) { wl.appendChild(el("li", null, t)); });
    why.appendChild(wl);
    d.appendChild(why);
  }

  function select(p) {
    current = p;
    renderDetail(p);
    renderList();
    if (window.matchMedia("(max-width: 767px)").matches) {
      document.getElementById("detail").scrollIntoView({ block: "start" });
    }
  }

  var statuses = {};
  profiles.forEach(function (p) { statuses[p.status] = (statuses[p.status] || 0) + 1; });
  var sel = document.getElementById("status");
  Object.keys(statuses).sort().forEach(function (s) {
    var o = el("option", null, s.replace(/_/g, " ") + " (" + statuses[s] + ")");
    o.value = s; sel.appendChild(o);
  });
  document.getElementById("q").addEventListener("input", function () { shown = PAGE; renderList(); });
  sel.addEventListener("change", function () { shown = PAGE; renderList(); });

  renderRun();
  var rows = renderList();
  if (profiles.length) { current = (rows && rows[0]) || profiles[0]; renderDetail(current); renderList(); }
  else { renderDetail(null); }
})();
</script>
</body>
</html>
